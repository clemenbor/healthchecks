name: uptime-check
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: "https://portal.biodiversitycellatlas.org"
            ping_secret: HC_PING_URL_1
          - site: "https://biodiversitycellatlas.org"
            ping_secret: HC_PING_URL_2
    steps:
      - name: Check ${{ matrix.site }}
        env:
          PING_URL: ${{ secrets[matrix.ping_secret] }}
        run: |
          if curl -fsS -m 20 --retry 2 -o /dev/null "${{ matrix.site }}"; then
            curl -fsS -m 10 --retry 3 "$PING_URL"
          else
            curl -fsS -m 10 --retry 3 "$PING_URL/fail"
          fi
