name: uptime-check
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: "https://portal.biodiversitycellatlas.org"
            ping_secret: HC_PING_URL_1
          - site: "https://biodiversitycellatlas.org"
            ping_secret: HC_PING_URL_2
    steps:
      - name: Check ${{ matrix.site }}
        env:
          PING_URL: ${{ secrets[matrix.ping_secret] }}
          SITE: ${{ matrix.site }}
        run: |
          code=$(curl -sSL -m 30 --retry 2 -o /dev/null -w "%{http_code}" "$SITE" || echo "000")
          echo "HTTP status for $SITE: $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
            curl -fsS -m 10 --retry 3 "$PING_URL"
          else
            curl -fsS -m 10 --retry 3 --data-raw "HTTP $code" "$PING_URL/fail"
          fi
