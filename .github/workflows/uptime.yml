name: uptime-check
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum)
  workflow_dispatch:         # lets you run it manually to test

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site and ping Healthchecks
        run: |
          if curl -fsS -m 20 --retry 2 "https://your-site.example.com"; then
            curl -fsS -m 10 --retry 3 "${{ secrets.HC_PING_URL }}"
          else
            curl -fsS -m 10 --retry 3 "${{ secrets.HC_PING_URL }}/fail"
          fi
